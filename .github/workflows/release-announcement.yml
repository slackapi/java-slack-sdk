name: Release announcement

on:
  release:
    types:
      - published

jobs:
  notify:
    name: Notify
    if: github.repository == 'slackapi/java-slack-sdk' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Notify Slack
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_RELEASE_ANNOUNCEMENTS_WEBHOOK_URL }}
          webhook-type: webhook-trigger
          payload: |
            action_url: "${{ github.event.release.html_url }}"
            message: "java-slack-sdk ${{ github.event.release.tag_name }}"
            repository: "${{ github.repository }}"
