name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  publish:
    name: Publish
    if: github.event_name == 'workflow_dispatch' && github.repository == 'slackapi/java-slack-sdk'
    runs-on: ubuntu-latest
    environment: central
    permissions:
      contents: read
    steps:
      - name: Checkout the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: "17"
          distribution: "zulu"
          server-id: central
          server-username-env-var: MAVEN_USERNAME
          server-password-env-var: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE

      - name: Add snapshot server credentials
        run: |
          sed -i '/<\/servers>/i \
            <server>\
              <id>central-snapshots</id>\
              <username>${env.MAVEN_USERNAME}</username>\
              <password>${env.MAVEN_PASSWORD}</password>\
            </server>' ~/.m2/settings.xml

      - name: Configure GPG
        run: |
          echo "use-agent" >> "${GNUPGHOME}/gpg.conf"
          echo "pinentry-mode loopback" >> "${GNUPGHOME}/gpg.conf"
          echo "allow-loopback-pinentry" >> "${GNUPGHOME}/gpg-agent.conf"
          echo RELOADAGENT | gpg-connect-agent

      - name: Publish to Maven Central
        run: |
          ./mvnw clean deploy \
            -P production-releases \
            -D maven.test.skip=true \
            -D gpg.passphrase="${MAVEN_GPG_PASSPHRASE}" \
            -pl !bolt-kotlin-examples \
            -pl !bolt-quarkus-examples \
            --batch-mode \
            --no-transfer-progress
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          MAVEN_OPTS: "--add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --add-opens=java.base/java.text=ALL-UNNAMED --add-opens=java.desktop/java.awt.font=ALL-UNNAMED"

  notify:
    name: Notify
    if: github.event_name == 'release' && !github.event.release.prerelease && github.repository == 'slackapi/java-slack-sdk'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Notify Slack
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_RELEASE_ANNOUNCEMENTS_WEBHOOK_URL }}
          webhook-type: webhook-trigger
          payload: |
            action_url: "${{ github.event.release.html_url }}"
            message: "java-slack-sdk ${{ github.event.release.tag_name }}"
            repository: "${{ github.repository }}"
